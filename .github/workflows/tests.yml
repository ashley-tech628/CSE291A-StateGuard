name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install -r requirements-eval.txt
      - run: pytest -q
      - run: python scripts/run_phase1.py --output results/phase1-pilot --seed 7
      - run: python scripts/run_paired_experiment.py --output results/paired-ci --seed 7
      - run: python scripts/inspect_provenance.py results/paired-ci/pairs/incorrect-db-port-3306__no_recovery__seed-7/paired.json --output results/paired-ci/incorrect-port-impact.json
